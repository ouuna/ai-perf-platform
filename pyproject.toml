[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-perf-platform"
version = "0.1.0"
description = "AI 智能性能测试平台：自然语言需求 → 结构化测试方案 → Locust 脚本 → 自动压测 → 指标分析 → 性能报告"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Perf Platform" }]
keywords = ["performance-testing", "locust", "llm", "load-testing", "fastapi"]
dependencies = [
    "locust>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "typer>=0.12",
    "httpx>=0.27",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "anthropic>=0.34",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "mypy>=1.11",
]

[project.scripts]
ai-perf = "app.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "demo_target*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["locustfile_generated", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["B008", "SIM108", "SIM102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: 需要真实靶站运行的集成测试",
]

[tool.coverage.run]
source = ["app", "demo_target"]
omit = ["*/locustfile_generated/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
